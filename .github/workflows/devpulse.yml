name: DevPulse frontend checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run devpulse:fixture:check
      - run: npm run typecheck:devpulse
      - run: npm run lint:devpulse
      - run: npm run test:devpulse
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:devpulse:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: devpulse-browser-results
          path: test-results/devpulse
